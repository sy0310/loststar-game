<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>失物星球 · 翻新素材检查</title><style>*{box-sizing:border-box}body{margin:0;background:#1c102f;color:#ffe6ba;font:15px/1.7 system-ui,sans-serif}main{max-width:1250px;margin:auto;padding:24px}h1{font-size:25px}h2{border-bottom:1px solid #b98965;padding-bottom:8px;font-size:20px}p,small{color:#d3bce4}a{color:#aee5e1}.boards,.screens{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.boards img,.screens img{width:100%;display:block}section{margin:26px 0}.item{padding:12px;border:1px solid #9f6e9e;background:#301d42;margin:13px 0}.states{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.states img{width:100%;image-rendering:pixelated;background:repeating-conic-gradient(#342244 0% 25%,#3d2950 0% 50%) 0/18px 18px}.states figure{margin:0;text-align:center}.states figcaption{font-size:13px}.files{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.files article{min-width:0;border:1px solid #704e7e;padding:8px}.files img{width:100%;height:150px;object-fit:contain;image-rendering:pixelated}.files small{display:block;overflow-wrap:anywhere;font-size:11px}summary{cursor:pointer;min-height:44px}@media(max-width:700px){.boards,.screens{grid-template-columns:1fr}.files{grid-template-columns:repeat(2,1fr)}} </style><main><h1>首星整体翻新 · 素材检查</h1><p>只读审核页：不连接玩家存档、不收费、不产生线索。概念板是风格参考，下面是独立制作的生产素材。工程验证与手机美术验收分别记录。</p><p><a href="CODEX_FULL_RENEWAL.md">任务书</a> · <a href="ART_SPEC.md">制作规格</a> · <a href="ASSET_REGISTRY.json">资产与注册</a> · <a href="VISUAL_COVERAGE.md">全页面覆盖</a></p><section><h2>已确认原图</h2><div class="boards"><img src="approved/01_pixel_art_production_baseline.png" alt="美术基准板"><img src="approved/02_first_planet_exploration.png" alt="探索界面设计"><img src="approved/03_curio_restoration_and_collection.png" alt="修复与收藏室设计"></div></section><section><h2>实际画布组合</h2><p>以下为实际游戏运行截图；只有截图文件完成后才会出现。连续动画、旧版对照与测试证据见交付图库。</p><div class="screens" id="screens"></div></section><section><h2>六件奇物 · 十八张完整状态图</h2><p>同一物件与注册角度；发现 → 清洁但仍损 → 结构稳定。收据缺签不因修纸变成已签收。</p><div id="states"></div></section><section><h2>全部生产层</h2><p id="summary">正在读取资产清单</p><div class="files" id="files"></div></section></main><script type="module">
const registry=await fetch('ASSET_REGISTRY.json').then(r=>r.json());const labels={receipt:'未购买的退货收据',tape:'道歉胶带',nested:'无限套娃包裹',stamp:'昨日邮戳','cosmic-parcel':'收件人：宇宙',bell:'无人签收铃'};const stages={found:'发现态',clean:'整理态',stabilized:'展示完成态'};
for(const[id,label]of Object.entries(labels)){const card=document.createElement('article');card.className='item';const title=document.createElement('h3');title.textContent=label;card.append(title);const grid=document.createElement('div');grid.className='states';for(const state of ['found','clean','stabilized']){const asset=registry.curioStates.find(x=>x.id===id&&x.state===state);const figure=document.createElement('figure'),image=new Image(),caption=document.createElement('figcaption');caption.textContent=stages[state];if(asset){image.src='../../'+asset.path;image.alt=label+' '+stages[state];figure.append(image);}figure.append(caption);grid.append(figure);}card.append(grid);document.querySelector('#states').append(card);}
for(const asset of registry.files.filter(x=>x.kind==='runtime'&&!/curios\/.+\.png$/.test(x.path))){const card=document.createElement('article'),image=new Image(),label=document.createElement('small');image.src='../../'+asset.path;image.alt=asset.path;label.textContent=asset.path.split('/').slice(-2).join('/')+' · '+asset.width+'×'+asset.height;card.append(image,label);document.querySelector('#files').append(card);}
document.querySelector('#summary').textContent=registry.files.length+'个源/运行文件 · '+registry.completeCurioStateCount+'/18完整状态图；分层坐标及哈希见清单。';
for(const name of ['chromium-390-day-world','chromium-390-receipt-stabilized','chromium-390-collection']){const image=new Image();image.src='../../artifacts/visual-renewal/screens/'+name+'.png';image.alt=name;image.onload=()=>document.querySelector('#screens').append(image);}
</script></html>
