<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>收藏室生产素材检查</title><style>*{box-sizing:border-box}body{margin:0;background:#170e28;color:#f5dca8;font:14px system-ui}main{max-width:390px;margin:auto}h1{font-size:18px;margin:14px 12px 4px}p{margin:6px 12px;color:#c9b4dc;font-size:12px}nav{display:flex;gap:6px;padding:10px 12px}button{border:1px solid #b17a4c;border-radius:3px;background:#382050;color:#ffe5af;min-height:44px;padding:8px 12px}#room{width:100%;position:relative}canvas{width:100%;height:auto;display:block;image-rendering:pixelated}.exhibit-hits{position:absolute;inset:0;pointer-events:none}.exhibit-hits button{position:absolute;pointer-events:auto;opacity:0}#focus{width:100%;max-width:390px}.museum-room{position:relative}</style><main><h1>收藏室 · 只读素材检查</h1><p>独立内存样本，不读写玩家档案。六物采用完成态，柜体同档对照。</p><nav><button data-level="0">0 罩</button><button data-level="1">1 灯座</button><button data-level="2">2 微景</button><button data-level="3">3 典藏</button></nav><div id="room"></div><p id="status"></p><canvas id="focus" width="640" height="700"></canvas></main><script type="module">
import{MuseumScene}from'/src/render/museum.ts';
import{prepareCurioTools,drawCurioSpecimen}from'/src/fusion/curio-condition.ts';
await prepareCurioTools();let level=0,detail='receipt';const ids=['receipt','tape','nested','stamp','cosmic-parcel','bell'];
const scene=new MuseumScene(document.querySelector('#room'),()=>({collection:ids}),()=>level,()=>performance.now()/1000,{renewal:true,drawSpecimen:(c,e,t,img,service)=>drawCurioSpecimen(c,e,img,{condition:'stabilized'},Date.now(),{seconds:t,serviceEnvelope:service?.specimenEnvelope??1})});
await scene.ready;scene.setActive(true);document.querySelectorAll('[data-level]').forEach(b=>b.onclick=()=>{level=+b.dataset.level});document.querySelectorAll('[data-exhibit]').forEach(b=>b.onclick=()=>{detail=b.dataset.exhibit});
function paint(){scene.renderExhibit(document.querySelector('#focus'),detail,level,performance.now()/1000);document.querySelector('#status').textContent=`${detail} · 柜体${level}级 · ${scene.canvas.dataset.robotAction||''}`;requestAnimationFrame(paint)}paint();window.__MUSEUM_INSPECTION__={scene,select:(id,l)=>{detail=id;level=l}};
</script></html>
