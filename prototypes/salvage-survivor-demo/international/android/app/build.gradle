plugins {
    id 'com.android.application'
}

android {
    namespace 'com.shuhua.lostship.starsurge'
    compileSdk 35
    buildToolsVersion '35.0.0'

    defaultConfig {
        applicationId 'com.shuhua.lostship.starsurge'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.6.10-global.1'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    buildFeatures {
        buildConfig true
    }
    testBuildType 'release'
    signingConfigs {
        release {
            def keyFile = System.getenv('LOSTSHIP_KEYSTORE')
            if (keyFile) {
                storeFile file(keyFile)
                storePassword System.getenv('LOSTSHIP_STORE_PASSWORD')
                keyAlias 'lostship'
                keyPassword System.getenv('LOSTSHIP_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        debug {
            applicationIdSuffix '.debug'
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'junit:junit:4.13.2'
}
