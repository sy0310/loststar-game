name: Vertical slice checks
on: [push, pull_request]
jobs:
  verify:
    # Pin a supported LTS image: the moving latest image's Ubuntu 26.04 package
    # mirror stalled this PR's browser dependency install for over 16 minutes.
    runs-on: ubuntu-24.04
    # The full six-project browser suite can exceed 20 minutes on a slower runner.
    # Keep every test and its own timeout; only the whole-job budget changes.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # Evidence-only commits must verify the frozen runtime's ancestry and
          # original source/asset trees, not substitute the current checkout SHA.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: python3 scripts/validate_design_assets.py
      - run: python3 design/visual-renewal/import_reference_pngs.py
      - name: Verify four approved A045 original PNGs
        run: python3 design/v045_a_simplified_exploration/validate_reference_pngs.py
      - name: Verify current asset and execution mappings
        run: npm run check:execution -- --report artifacts/execution-ci.json
      - run: npm run test:coverage
      - run: npm run build
      - run: npm run build:d1
      - run: npm run build:v034
      - run: npm run build:fusion
      - run: npm run build:v036
      - name: Use Ubuntu archive for browser dependencies
        run: |
          sudo python3 - <<'PY'
          from pathlib import Path
          mirrorlist = Path('/etc/apt/apt-mirrors.txt')
          paths = [Path('/etc/apt/sources.list'), mirrorlist, *Path('/etc/apt/sources.list.d').glob('*')]
          checked = 0
          for path in paths:
              if not path.is_file() or (path != mirrorlist and path.suffix not in ('.list', '.sources')):
                  continue
              checked += 1
              original = path.read_text()
              updated = original.replace('http://azure.archive.ubuntu.com/ubuntu', 'https://archive.ubuntu.com/ubuntu').replace('https://azure.archive.ubuntu.com/ubuntu', 'https://archive.ubuntu.com/ubuntu')
              if updated != original:
                  path.write_text(updated)
                  print(f'Using Ubuntu archive in {path.name}')
              if 'azure.archive.ubuntu.com/ubuntu' in path.read_text():
                  raise RuntimeError(f'Azure Ubuntu mirror remains in {path.name}')
          if not checked:
              raise RuntimeError('No Ubuntu APT source files found')
          PY
      - run: npx playwright install --with-deps chromium webkit
        timeout-minutes: 5
      - run: npm run test:e2e
      - name: Verify the compressed H5 package
        run: |
          npm run package:fusion
          npx vite build --ssr scripts/feedback_fixtures.ts --outDir releases/feedback-fixtures
          mkdir -p artifacts/ci-package
          python3 -m http.server 8765 --bind 127.0.0.1 --directory releases/taptap > /tmp/loststar-ci-package-server.log 2>&1 &
          task_pkg_pid=$!
          trap 'kill "$task_pkg_pid"' EXIT
          curl --fail --retry 10 --retry-delay 1 --retry-connrefused --silent http://127.0.0.1:8765/loststar-fusion/ > /dev/null
          RENEWAL_URL=http://127.0.0.1:8765/loststar-fusion/ RENEWAL_OUTPUT=artifacts/ci-package node scripts/smoke_visual_renewal_package.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: |
            artifacts/e2e-results.json
            artifacts/mobile-*.png
            artifacts/desktop-*.png
            artifacts/webkit-*.png
            test-results/
            coverage/
            artifacts/ci-package/package-smoke.json
            artifacts/execution-ci.json
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always() && (hashFiles('artifacts/v045-a-exploration/screens-evidence.json') != '' || hashFiles('artifacts/v044-execution-art/proof.json') != '' || hashFiles('artifacts/v042-physical-review/museum-physical-evidence.json') != '' || hashFiles('artifacts/v041-receipt-review/screens-evidence.json') != '' || hashFiles('artifacts/visual-renewal/screens-evidence.json') != '')
        with:
          name: visual-renewal-review
          path: |
            artifacts/visual-renewal/
            artifacts/v041-receipt-review/
            artifacts/v042-physical-review/
            artifacts/v043-whole-state-review/
            artifacts/v044-execution-art/
            artifacts/v045-a-exploration/
            !artifacts/visual-renewal/raw/
            !artifacts/visual-renewal/internal/
            !artifacts/v041-receipt-review/raw/
            !artifacts/v042-physical-review/raw/
            !artifacts/v043-whole-state-review/raw/
            !artifacts/v044-execution-art/raw/
            !artifacts/v045-a-exploration/raw/
            !artifacts/v045-a-exploration/**/*.webm
          retention-days: 14
  reference-ui-sample:
    name: Isolated reference UI sample
    runs-on: ubuntu-24.04
    # 72 natural-time flows take about six minutes; retain every assertion and
    # zero retries while allowing checkout/browser-install and media-upload time.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck isolated sample
        run: npx tsc --noEmit -p prototypes/ref-ui/tsconfig.json
      - name: Build isolated sample (formal entry unchanged)
        run: npx vite build --config prototypes/ref-ui/vite.config.ts
      - name: Use Ubuntu archive for browser dependencies
        run: |
          sudo python3 - <<'PY'
          from pathlib import Path
          paths = [Path('/etc/apt/sources.list'), Path('/etc/apt/apt-mirrors.txt'), *Path('/etc/apt/sources.list.d').glob('*')]
          for path in paths:
              if path.is_file() and (path.name == 'apt-mirrors.txt' or path.suffix in ('.list', '.sources')):
                  text = path.read_text().replace('http://azure.archive.ubuntu.com/ubuntu', 'https://archive.ubuntu.com/ubuntu').replace('https://azure.archive.ubuntu.com/ubuntu', 'https://archive.ubuntu.com/ubuntu')
                  path.write_text(text)
          PY
      - run: npx playwright install --with-deps chromium webkit
        timeout-minutes: 5
      - name: Validate sample input, original costs, storage isolation and responsive layout
        run: npx playwright test --config prototypes/ref-ui/playwright.config.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: isolated-reference-ui
          path: |
            releases/ref-ui-e2e-results.json
            releases/ref-ui-test-results/
            artifacts/ref-ui-sample/
            artifacts/ref-ui-unified/
          retention-days: 14
