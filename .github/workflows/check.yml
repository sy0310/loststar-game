name: Vertical slice checks
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: python3 scripts/validate_design_assets.py
      - run: npm run test:coverage
      - run: npm run build
      - run: npm run build:d1
      - run: npm run build:v034
      - run: npm run build:fusion
      - run: npm run build:v036
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: |
            artifacts/
            test-results/
            coverage/
          retention-days: 14
